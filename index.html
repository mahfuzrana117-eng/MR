<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Md Mahfuz Rana | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #070b14;
      --bg-soft: #0d1424;
      --card: rgba(17, 27, 46, 0.75);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --secondary: #22d3ee;
      --border: rgba(148, 163, 184, 0.15);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    body.light {
      --bg: #f1f5f9;
      --bg-soft: #ffffff;
      --card: rgba(255, 255, 255, 0.8);
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.1);
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      transition: 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: var(--primary);
      filter: blur(180px);
      opacity: 0.12;
      top: -200px;
      left: -150px;
      z-index: -1;
    }

    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: var(--secondary);
      filter: blur(180px);
      opacity: 0.08;
      bottom: -200px;
      right: -100px;
      z-index: -1;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1120px, 90%);
      margin: auto;
    }

    /* Navbar */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    body.light header {
      background: rgba(241, 245, 249, 0.85);
    }

    nav {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--secondary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      transition: 0.3s;
      cursor: pointer;
    }

    .nav-links a:hover,
    .nav-links a.active-link {
      color: var(--secondary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
    }

    /* Section Control */
    .page-section {
      display: none;
      padding: 100px 0;
      flex: 1;
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    #home.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      align-items: center;
      padding-top: 80px;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 50px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid rgba(34, 211, 238, 0.25);
      background: rgba(34, 211, 238, 0.06);
      border-radius: 30px;
      color: var(--secondary);
      font-size: 12px;
      margin-bottom: 20px;
    }

    .badge i {
      font-size: 7px;
    }

    .hero h1 {
      font-size: clamp(40px, 5.5vw, 64px);
      line-height: 1.12;
      letter-spacing: -2.5px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--muted);
      max-width: 520px;
      font-size: 15px;
    }

    /* Profile Card */
    .profile-wrap {
      display: flex;
      justify-content: center;
    }

    .profile-card {
      width: 320px;
      height: 370px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: linear-gradient(
        145deg,
        rgba(59, 130, 246, 0.12),
        var(--card)
      );
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: var(--primary);
      filter: blur(90px);
      opacity: 0.2;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid rgba(34, 211, 238, 0.65);
      object-fit: cover;
      object-position: center;
      display: block;
      position: relative;
      z-index: 1;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .profile-card h3 {
      margin-top: 18px;
      font-size: 20px;
      position: relative;
      z-index: 1;
    }

    .profile-card p {
      color: var(--secondary);
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    .socials {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      position: relative;
      z-index: 1;
    }

    .socials a {
      width: 35px;
      height: 35px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      transition: 0.3s;
    }

    .socials a:hover {
      color: var(--secondary);
      border-color: var(--secondary);
      transform: translateY(-3px);
    }

    /* Section Titles */
    .section-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-title small {
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .section-title h2 {
      font-size: 36px;
      margin-top: 10px;
      letter-spacing: -1px;
    }

    .section-title p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px
