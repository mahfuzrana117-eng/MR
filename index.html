<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Mahfuz Rana | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #0066ff;
            --accent-color: #22d3ee;
            --bg-gradient: radial-gradient(circle at top, #e0f2fe 0%, #f8fafc 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
        }

        .dark-mode {
            --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.90);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            transition: 0.3s ease;
        }

        .portal-container {
            max-width: 440px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 25px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .nav-icons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--border-color);
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-color);
            font-size: 16px;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .user-avatar-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary-color);
        }

        .user-avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Welcome & Profile Section */
        .welcome-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .portal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .profile-img-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #0066ff, #22d3ee);
            padding: 3px;
        }

        .meet-text {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-bio {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Dashboard Button */
        .dashboard-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0066ff;
            color: white;
            padding: 14px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .dashboard-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 102, 255, 0.4);
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 30px;
            font-weight: 600;
        }

        /* Dashboard Modal / Popup Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 30px;
            max-width: 420px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            text-align: left;
            position: relative;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: var(--border-color);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 16px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-box {
            background: var(--border-color);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Dashboard Extra Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .option-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-card i {
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .option-card span {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-color);
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: 0.3s;
            font-weight: 500;
        }

        .link-item:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
    </style>
</head>
<body class="dark-mode">

    <!-- Home Page Main Container -->
    <div class="portal-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="logo">MR</div>
            <div class="nav-icons">
                <button class="nav-btn" id="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                <button class="nav-btn" onclick="openDashboard()"><i class="fas fa-th"></i></button>
                <div class="user-avatar-btn">
                    <img src="IMG_20260331_195455.jpg" alt="Mahfuz">

                <button class="nav-btn" onclick="openDashboard()"><i class="fas fa-bars"></i></button>
            </div>
        </div>

        <!-- Header Titles -->
        <div class="welcome-text">Assalamualaikum</div>
        <div class="portal-title">Welcom to my website</div>

        <!-- Profile Image & Info -->
        <div class="profile-img-container">
            <img src="IMG_20260331_195455.jpg" alt="Md Mahfuz Rana" class="profile-img">
        </div>
        
        <div class="meet-text">MEET</div>
        <h1 class="profile-name">Md Mahfuz Rana</h1>
        <p class="profile-bio">Student, Masjid Mission Academy<br>Rajshahi, Bangladesh</p>

        <!-- Dashboard Button -->
        <button class="dashboard-btn" onclick="openDashboard()">
            ড্যাশবোর্ড <i class="fas fa-arrow-right"></i>
        </button>

        <div class="footer-note">
            রাজশাহী, বাংলাদেশ

    </div>

    <!-- Dashboard Modal (Hidden by default, opens on clicking Dashboard) -->
    <div id="dashboardModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeDashboard()"><i class="fas fa-times"></i></button>
            
            <div class="modal-title">

            <!-- New Management Options: Add Photo, Video, Note, Password -->
            <div class="section-title">ম্যানেজমেন্ট অপশন</div>
            <div class="options-grid">
                <div class="option-card" onclick="alert('অ্যাড ফটো অপশন সিলেক্ট করা হয়েছে!')">
                    <i class="fas fa-images"></i>
                    <span>অ্যাড ফটো</span>
                </div>
                <div class="option-card" onclick="alert('অ্যাড ভিডিও অপশন সিলেক্ট করা হয়েছে!')">
                    <i class="fas fa-video"></i>

                <div class="option-card" onclick="alert('অ্যাড নোট অপশন সিলেক্ট করা হয়েছে!')">
                    <i class="fas fa-sticky-note"></i>
                    <span>অ্যাড নোট</span>

                <div class="option-card" onclick="alert('অ্যাড পাসওয়ার্ড অপশন সিলেক্ট করা হয়েছে!')">
                    <i class="fas fa-key"></i>
                    <span>অ্যাড পাসওয়ার্ড</span>
                </div>
            </div>

            <!-- Connect With Me Links Inside Dashboard -->
            <div class="section-box">
                <div class="section-title">Connect With Me</div>
                <div class="links-grid">
                    <a href="tel:+8809658083118" class="link-item"><i class="fas fa-phone-alt" style="color:#22c55e;"></i> Call</a>
                    <a href="https://wa.me/8801799264290" class="link-item"><i class="fab fa-whatsapp" style="color:#22c55e;"></i> WhatsApp</a>
                    <a href="https://www.instagram.com/mahfuzur_rahman_mahfuz_?igsh=dWQyd3llNXNqcnIw" class="link-item"><i class="fab fa-instagram" style="color:#ec4899;"></i> Instagram</a>
                    <a href="https://www.threads.net/@mahfuzur_rahman_mahfuz_" class="link-item"><i class="fab fa-threads"></i> Threads</a>
                    <a href="https://t.me/+8801799264290" class="link-item"><i class="fab fa-telegram-plane" style="color:#0ea5e9;"></i> Telegram</a>
                    <a href="https://www.facebook.com/share/1BM9QbkLbU/" class="link-item"><i class="fab fa-facebook-f" style="color:#3b82f6;"></i> Facebook</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dark/Light Mode Switch Function
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const themeBtn = document.getElementById('theme-toggle').querySelector('i');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.className = "fas fa-moon";
            } else {
                themeBtn.className = "fas fa-sun";
            }
        }

        // Dashboard Modal Open/Close Functions
        function openDashboard() {
            document.getElementById('dashboardModal').style.display = 'flex';
        }

        function closeDashboard() {
            document.getElementById('dashboardModal').style.display = 'none';
        }

        // Close modal if clicked outside of the content box
        window.onclick = function(event) {
            let modal = document.getElementById('dashboardModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
